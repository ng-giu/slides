name: Build Course PDFs

on:
  push:
    paths:
      - "courses/**/*.md"
      - "courses/**/public/**"
      - "theme/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-labs-pdfs.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Export all course PDFs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          courses=(courses/*)
          if [ "${#courses[@]}" -eq 0 ]; then
            echo "No courses found in courses/"
            exit 1
          fi

          for cdir in "${courses[@]}"; do
            [ -d "$cdir" ] || continue
            course="${cdir##*/}"
            echo "=== Processing course: $course ==="

            for f in "$cdir"/lab-*.md; do
              [ -f "$f" ] || continue
              num="${f##*/}"
              num="${num#lab-}"
              num="${num%.md}"
              echo "Exporting lab $num for $course"
              bun run export "$course" "$num"
            done

            for f in "$cdir"/assignment-*.md; do
              [ -f "$f" ] || continue
              num="${f##*/}"
              num="${num#assignment-}"
              num="${num%.md}"
              echo "Exporting assignment $num for $course"
              bun run export:assignment "$course" "$num"
            done
          done

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: course-pdfs-${{ github.sha }}
          path: dist/**/*.pdf
          if-no-files-found: error
