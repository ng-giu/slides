name: Build Course PDFs

on:
  push:
    paths:
      - "courses/**/*.md"
      - "courses/**/public/**"
      - "theme/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-labs-pdfs.yml"
  workflow_dispatch:

jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Export all course PDFs
        # Uses the same script as `bun run export:all` locally, so CI and a
        # developer's machine cannot drift. deck.sh's `all` branch exports
        # every deck by filename, which means a deck whose name is not
        # `<kind>-<number>.md` no longer fails the whole build.
        run: bun run export:all

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: course-pdfs-${{ github.sha }}
          path: dist/**/*.pdf
          if-no-files-found: error
