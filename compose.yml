# Base configuration anchor for Slidev deck containers
x-slidev-base: &slidev-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ebd-slides:latest
  restart: unless-stopped
  expose:
    - "3030"
  networks:
    - nginx-proxy
  # No volume bind mounts - edits in the Slidev in-browser editor stay ephemeral to the container

services:
  # ===========================================================================
  # EBD (Electronic Business Development) Decks
  # ===========================================================================
  ebd-lab-01:
    <<: *slidev-base
    container_name: ebd-lab-01
    command: ["lab", "ebd", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_01_HOST:-${LAB_01_HOST:-lab1.ebd.nourgaser.com}}
      - LETSENCRYPT_HOST=${EBD_LAB_01_HOST:-${LAB_01_HOST:-lab1.ebd.nourgaser.com}}

  # ebd-lab-02:
  #   <<: *slidev-base
  #   container_name: ebd-lab-02
  #   command: ["lab", "ebd", "2"]
  #   environment:
  #     - VIRTUAL_PORT=3030
  #     - VIRTUAL_HOST=${EBD_LAB_02_HOST:-${LAB_02_HOST:-lab2.ebd.nourgaser.com}}
  #     - LETSENCRYPT_HOST=${EBD_LAB_02_HOST:-${LAB_02_HOST:-lab2.ebd.nourgaser.com}}

  # ebd-assignment-01:
  #   <<: *slidev-base
  #   container_name: ebd-assignment-01
  #   command: ["assignment", "ebd", "1"]
  #   environment:
  #     - VIRTUAL_PORT=3030
  #     - VIRTUAL_HOST=${EBD_ASSIGNMENT_01_HOST:-${ASSIGNMENT_01_HOST:-assignment1.ebd.nourgaser.com}}
  #     - LETSENCRYPT_HOST=${EBD_ASSIGNMENT_01_HOST:-${ASSIGNMENT_01_HOST:-assignment1.ebd.nourgaser.com}}

  # ===========================================================================
  # ICA (Information & Communication Architecture) Decks
  # ===========================================================================
  ica-lab-01:
    <<: *slidev-base
    container_name: ica-lab-01
    command: ["lab", "ica", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_01_HOST:-lab1.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_01_HOST:-lab1.ica.nourgaser.com}

  # ica-lab-02:
  #   <<: *slidev-base
  #   container_name: ica-lab-02
  #   command: ["lab", "ica", "2"]
  #   environment:
  #     - VIRTUAL_PORT=3030
  #     - VIRTUAL_HOST=${ICA_LAB_02_HOST:-lab2.ica.nourgaser.com}
  #     - LETSENCRYPT_HOST=${ICA_LAB_02_HOST:-lab2.ica.nourgaser.com}

networks:
  nginx-proxy:
    name: nginx-proxy
    external: true
