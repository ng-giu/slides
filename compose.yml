# Base configuration anchor for Slidev deck containers
x-slidev-base: &slidev-base
  build:
    context: .
    dockerfile: Dockerfile
  image: ebd-slides:latest
  restart: unless-stopped
  expose:
    - "3030"
  networks:
    - nginx-proxy
  # No volume bind mounts - edits in the Slidev in-browser editor stay ephemeral to the container

services:
  # ===========================================================================
  # EBD (Electronic Business Development) Decks
  # ===========================================================================
  ebd-lab-01:
    <<: *slidev-base
    container_name: ebd-lab-01
    command: ["lab", "ebd", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_01_HOST:-${LAB_01_HOST:-lab1.ebd.nourgaser.com}}
      - LETSENCRYPT_HOST=${EBD_LAB_01_HOST:-${LAB_01_HOST:-lab1.ebd.nourgaser.com}}

  ebd-lab-02:
    <<: *slidev-base
    container_name: ebd-lab-02
    command: ["lab", "ebd", "2"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_02_HOST:-${LAB_02_HOST:-lab2.ebd.nourgaser.com}}
      - LETSENCRYPT_HOST=${EBD_LAB_02_HOST:-${LAB_02_HOST:-lab2.ebd.nourgaser.com}}

  ebd-lab-03:
    <<: *slidev-base
    container_name: ebd-lab-03
    command: ["lab", "ebd", "3"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_03_HOST:-lab3.ebd.nourgaser.com}
      - LETSENCRYPT_HOST=${EBD_LAB_03_HOST:-lab3.ebd.nourgaser.com}

  ebd-lab-04:
    <<: *slidev-base
    container_name: ebd-lab-04
    command: ["lab", "ebd", "4"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_04_HOST:-lab4.ebd.nourgaser.com}
      - LETSENCRYPT_HOST=${EBD_LAB_04_HOST:-lab4.ebd.nourgaser.com}

  ebd-lab-05:
    <<: *slidev-base
    container_name: ebd-lab-05
    command: ["lab", "ebd", "5"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_05_HOST:-lab5.ebd.nourgaser.com}
      - LETSENCRYPT_HOST=${EBD_LAB_05_HOST:-lab5.ebd.nourgaser.com}

  ebd-lab-05-extra:
    <<: *slidev-base
    container_name: ebd-lab-05-extra
    command: ["lab", "ebd", "5-extra"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_LAB_05_EXTRA_HOST:-lab5-extra.ebd.nourgaser.com}
      - LETSENCRYPT_HOST=${EBD_LAB_05_EXTRA_HOST:-lab5-extra.ebd.nourgaser.com}

  ebd-assignment-01:
    <<: *slidev-base
    container_name: ebd-assignment-01
    command: ["assignment", "ebd", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_ASSIGNMENT_01_HOST:-${ASSIGNMENT_01_HOST:-assignment1.ebd.nourgaser.com}}
      - LETSENCRYPT_HOST=${EBD_ASSIGNMENT_01_HOST:-${ASSIGNMENT_01_HOST:-assignment1.ebd.nourgaser.com}}

  ebd-assignment-02:
    <<: *slidev-base
    container_name: ebd-assignment-02
    command: ["assignment", "ebd", "2"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${EBD_ASSIGNMENT_02_HOST:-assignment2.ebd.nourgaser.com}
      - LETSENCRYPT_HOST=${EBD_ASSIGNMENT_02_HOST:-assignment2.ebd.nourgaser.com}

  # ===========================================================================
  # ICA (Information & Communication Architecture) Decks
  # ===========================================================================
  ica-lab-01:
    <<: *slidev-base
    container_name: ica-lab-01
    command: ["lab", "ica", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_01_HOST:-lab1.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_01_HOST:-lab1.ica.nourgaser.com}

  ica-lab-02:
    <<: *slidev-base
    container_name: ica-lab-02
    command: ["lab", "ica", "2"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_02_HOST:-lab2.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_02_HOST:-lab2.ica.nourgaser.com}

  ica-lab-03:
    <<: *slidev-base
    container_name: ica-lab-03
    command: ["lab", "ica", "3"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_03_HOST:-lab3.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_03_HOST:-lab3.ica.nourgaser.com}

  ica-lab-04:
    <<: *slidev-base
    container_name: ica-lab-04
    command: ["lab", "ica", "4"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_04_HOST:-lab4.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_04_HOST:-lab4.ica.nourgaser.com}

  ica-lab-05:
    <<: *slidev-base
    container_name: ica-lab-05
    command: ["lab", "ica", "5"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_LAB_05_HOST:-lab5.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_LAB_05_HOST:-lab5.ica.nourgaser.com}

  ica-assignment-01:
    <<: *slidev-base
    container_name: ica-assignment-01
    command: ["assignment", "ica", "1"]
    environment:
      - VIRTUAL_PORT=3030
      - VIRTUAL_HOST=${ICA_ASSIGNMENT_01_HOST:-assignment1.ica.nourgaser.com}
      - LETSENCRYPT_HOST=${ICA_ASSIGNMENT_01_HOST:-assignment1.ica.nourgaser.com}

  # ===========================================================================
  # Index: every course, with links to each deck online and as a PDF
  # ===========================================================================
  site:
    build:
      context: .
      dockerfile: Dockerfile.site
    image: giu-slides-site:latest
    container_name: slides-site
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - nginx-proxy
    environment:
      - VIRTUAL_PORT=80
      - VIRTUAL_HOST=${SITE_HOST:-slides.nourgaser.com}
      - LETSENCRYPT_HOST=${SITE_HOST:-slides.nourgaser.com}

networks:
  nginx-proxy:
    name: nginx-proxy
    external: true
