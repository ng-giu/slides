project:
  title: Course project
  summary: >-
    Teams of 5–6 design and build a multi-page web application from concept to
    implementation, with one complete end-to-end feature owned by each member.
    Graded across six deliverables: PD1 Concept, User Stories, Acceptance Criteria
    & Wireframes (20%), PD2 Clickable Figma Prototype (20%), PD3 Multi-Page
    HTML/CSS Website + Live JavaScript API Integration (20%), Final Report with
    AI Prompt Appendix (10%), Final Presentation (15%), and an A1 Printed Poster (5%).
  documents:
    - { label: Project brief, source: project/brief.html, out: project-brief.pdf, note: "With Student Poster Conference" }
    - { label: Project brief (no poster conference), source: project/brief-no-poster-conference.html, out: project-brief-no-poster-conference.pdf, note: "Without Student Poster Conference" }
    - { label: README template, source: project/README-template.md, out: project-README-template.md, note: "Team repository template" }

